  <g filter="url(#patchShadow)" transform="translate(-283,-158) rotate(-12 535 510) translate(535,510) scale(0.8) translate(-535,-510)">
    <polygon points="609,541 566,584 504,584 461,541 461,479 504,436 566,436 609,479" fill="#FF2E4D" stroke="#EAFBFF" stroke-width="8"/>
    <text x="535" y="523" text-anchor="middle" class="sign" font-size="46" font-weight="700" letter-spacing="2" fill="#FFFFFF">SIDE</text>
