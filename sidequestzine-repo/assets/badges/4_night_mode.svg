    <polygon points="-33,-36 18,-41 39,-24 34,28 -6,42 -38,29 -30,-8" fill="#F1ECDE"/>
    <text x="0" y="22" text-anchor="middle" class="f-black" font-size="70" fill="#1A1A18" transform="rotate(-4)">S</text>
  </g>
  <g transform="translate(575,468) rotate(-21.5) scale(0.980)" filter="url(#scrapShadow)">
    <polygon points="-27,-42 20,-37 38,-20 32,32 -10,41 -35,22 -32,-14" fill="#4A4A45"/>
    <text x="0" y="22" text-anchor="middle" class="f-mono" font-weight="700" font-size="70" fill="#EFEAD9" transform="rotate(3)">T</text>
  </g>

