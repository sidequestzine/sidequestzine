    <text x="0" y="24" text-anchor="middle" class="f-black" font-size="76" fill="#1A1A18" transform="rotate(-4)">d</text>
  </g>
  <g transform="translate(472,687) rotate(-19.0) scale(0.340)" filter="url(#scrapShadow)">
    <polygon points="-27,-42 20,-37 38,-20 32,32 -10,41 -35,22 -32,-14" fill="#C9BC9C"/>
    <text x="0" y="24" text-anchor="middle" class="f-mono" font-weight="700" font-size="76" fill="#171614" transform="rotate(5)">r</text>
  </g>
  <g transform="translate(499,679) rotate(-15.6) scale(0.340)" filter="url(#scrapShadow)">
    <polygon points="-38,-40 12,-46 40,-33 43,26 8,41 -33,37 -41,-6" fill="#F1ECDE"/>
