    <text x="0" y="24" text-anchor="middle" class="f-serif" font-style="italic" font-weight="700" font-size="76" fill="#1A1A18" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(-4)">w</text>
