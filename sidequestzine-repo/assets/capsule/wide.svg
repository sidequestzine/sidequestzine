    <text x="0" y="24" text-anchor="middle" class="f-black" font-size="76" fill="#171614" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(5)">i</text>
  </g>
  <g transform="translate(335,654) rotate(3.0) scale(0.340)" filter="url(#scrapShadow)">
    <polygon points="-27,-42 20,-37 38,-20 32,32 -10,41 -35,22 -32,-14" fill="#F1ECDE"/>
    <text x="0" y="24" text-anchor="middle" class="f-mono" font-weight="700" font-size="76" fill="#26241F" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(-3)">t</text>
  </g>
