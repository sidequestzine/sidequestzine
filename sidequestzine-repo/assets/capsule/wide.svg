    <text x="0" y="24" text-anchor="middle" class="f-mono" font-weight="700" font-size="76" fill="#171614" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(5)">r</text>
  </g>
  <g transform="translate(545,653) rotate(4.0) scale(0.340)" filter="url(#scrapShadow)">
    <polygon points="-38,-40 12,-46 40,-33 43,26 8,41 -33,37 -41,-6" fill="#F1ECDE"/>
    <text x="0" y="24" text-anchor="middle" class="f-fat" font-size="76" fill="#26241F" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(-3)">i</text>
  </g>
  <g transform="translate(575,650) rotate(-2.0) scale(0.340)" filter="url(#scrapShadow)">
    <polygon points="-30,-44 22,-39 34,-27 31,30 -12,40 -36,26 -33,-12" fill="#EFEADC"/>
    <text x="0" y="24" text-anchor="middle" class="f-cond" font-size="76" fill="#1A1A18" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(4)">u</text>
