    <text x="0" y="24" text-anchor="middle" class="f-serif" font-style="italic" font-weight="700" font-size="76" fill="#26241F" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(3)">o</text>
  </g>
  <g transform="translate(485,654) rotate(2.0) scale(0.340)" filter="url(#scrapShadow)">
    <polygon points="-33,-36 18,-41 39,-24 34,28 -6,42 -38,29 -30,-8" fill="#EFEADC"/>
    <text x="0" y="24" text-anchor="middle" class="f-black" font-size="76" fill="#1A1A18" stroke="#FFFDF6" stroke-width="2.1" paint-order="stroke" transform="rotate(-4)">d</text>
  </g>
  <g transform="translate(515,649) rotate(-5.0) scale(0.340)" filter="url(#scrapShadow)">
